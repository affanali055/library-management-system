<!-- books/templates/books/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #74ebe1 0%, #89f7fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            width: 100%;
            max-width: 400px;
            padding: 35px;
        }
        .btn-login {
            background-image: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="mb-4 text-center text-primary font-weight-bold">Log In</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
                <!-- Display authentication error message -->
        {% if error_message %}
            <div class="alert alert-danger">{{ error_message }}</div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter Username" required id="id_username">
            </div>
            
            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter Password" required id="id_password">
            </div>
            
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-login btn-lg">Log In</button>
            </div>
            
            <div class="text-center mt-3">
                <span class="text-muted small">Don't have an account? <a href="{% url 'register' %}">Register</a></span>
            </div>
        </form>
    </div>
</body>
</html>
